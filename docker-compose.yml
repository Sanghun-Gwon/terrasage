services:
  postgres:
    image: postgres:16
    container_name: terrasage-postgres
    environment:
      POSTGRES_DB: terrasage
      POSTGRES_USER: terrasage
      POSTGRES_PASSWORD: terrasage
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
