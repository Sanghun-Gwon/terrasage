# terrasage-web 이미지 빌드 (deploy.sh에서 호출)
# NEXT_PUBLIC_API_URL은 빌드 시점에 클라이언트 번들로 인라인되므로
# gcloud run deploy --source 방식 대신 build-arg를 전달하는 별도 빌드가 필요함
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
