spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:terrasage}
    username: ${DB_USERNAME:terrasage}
    password: ${DB_PASSWORD:terrasage}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        default_schema: public
  sql:
    init:
      mode: always

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:terrasage-dev-secret-key-must-be-at-least-32-bytes-long}
  expiration-ms: 3600000  # 1시간

# 개인정보(전화번호 등) AES-256-GCM 암호화
# 운영: ENCRYPT_SECRET, ENCRYPT_SALT 환경변수로 반드시 교체
encrypt:
  secret: ${ENCRYPT_SECRET:terrasage-dev-encrypt-secret-key}
  salt: ${ENCRYPT_SALT:6163653536643234}  # hex 8바이트 이상

logging:
  level:
    com.terrasage: DEBUG
