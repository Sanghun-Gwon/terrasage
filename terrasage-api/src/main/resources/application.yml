spring:
  datasource:
    # 로컬: 개별 환경변수 조합 사용
    # Neon DB: DATABASE_URL=postgresql://user:password@host/dbname?sslmode=require
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:terrasage}}
    username: ${DB_USERNAME:terrasage}
    password: ${DB_PASSWORD:terrasage}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        default_schema: public
  sql:
    init:
      mode: always

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:terrasage-dev-secret-key-must-be-at-least-32-bytes-long}
  expiration-ms: 3600000  # 1시간

# 개인정보(전화번호 등) AES-256-GCM 암호화
# 운영: ENCRYPT_SECRET, ENCRYPT_SALT 환경변수로 반드시 교체
encrypt:
  secret: ${ENCRYPT_SECRET:terrasage-dev-encrypt-secret-key}
  salt: ${ENCRYPT_SALT:6163653536643234}

# CORS 허용 출처 — 쉼표 구분
# 운영: CORS_ALLOWED_ORIGINS=https://terrasage.com,https://terrasage-web-xxxx.run.app
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

logging:
  level:
    com.terrasage: DEBUG
