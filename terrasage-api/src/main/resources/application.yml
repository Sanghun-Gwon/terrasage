spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:terrasage}
    username: ${DB_USERNAME:terrasage}
    password: ${DB_PASSWORD:terrasage}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        default_schema: public
  sql:
    init:
      mode: always

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:terrasage-dev-secret-key-must-be-at-least-32-bytes-long}
  expiration-ms: 3600000  # 1시간

logging:
  level:
    com.terrasage: DEBUG
